<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="孙巨的教室冒险 · Remaster —— 在课桌阵里躲开舞剑同学，把同学温暖回座位。" />
    <meta name="theme-color" content="#171a21" />
    <title>孙巨的教室冒险 · Remaster</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171a21'/%3E%3Crect x='7' y='9' width='12' height='12' fill='%23ffd27a'/%3E%3Crect x='9' y='12' width='3' height='3' fill='%23111'/%3E%3Crect x='14' y='12' width='3' height='3' fill='%23111'/%3E%3Crect x='11' y='18' width='6' height='2' fill='%23111'/%3E%3Crect x='9' y='21' width='12' height='8' fill='%234169e1'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="app" id="app">
      <main class="stage" id="stage" aria-label="孙巨的教室冒险">
        <header class="hud" id="hud" aria-label="状态栏"></header>
        <div class="screen-wrap" id="screenWrap">
          <canvas id="game" width="504" height="336" aria-label="游戏画面"></canvas>
          <div class="overlay" id="overlay" aria-live="polite"></div>
        </div>
        <div class="touch" id="touch" aria-hidden="true">
          <div class="touch__pad">
            <span></span>
            <button class="touch__btn" data-dir="up" aria-label="向上">▲</button>
            <span></span>
            <button class="touch__btn" data-dir="left" aria-label="向左">◀</button>
            <span></span>
            <button class="touch__btn" data-dir="right" aria-label="向右">▶</button>
            <span></span>
            <button class="touch__btn" data-dir="down" aria-label="向下">▼</button>
            <span></span>
          </div>
          <div class="touch__actions">
            <button class="touch__btn" data-touch="interact" aria-label="喊同学回座位">喊人</button>
            <button class="touch__btn" data-touch="skill" aria-label="使用温暖了">温暖了</button>
          </div>
        </div>
        <div class="dialog" id="dialog" role="log" aria-live="polite"></div>
        <footer class="footer" id="footer"></footer>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
